[project]
name = "adlc-poc-decider-image"
version = "0.0.0"
requires-python = "==3.11.*"
dependencies = [
  "strands-decider[cpu]==0.2.0",
  "torch==2.7.1+cpu",
  "transformers==5.19.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
